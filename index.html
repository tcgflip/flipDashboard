<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213D">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%2314213D'/%3E%3Ctext x='90' y='120' font-family='Georgia,serif' font-size='84' fill='%23E3A857' text-anchor='middle'%3EPF%3C/text%3E%3C/svg%3E">
<title>Poke Fips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D; --navy-light:#1E2E4F; --gold:#E3A857;
    --coral:#E8664A; --cream:#F2EFE6; --muted:#9AA7BD;
    --hairline:rgba(242,239,230,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--navy); color:var(--cream);
    font-family:'IBM Plex Sans',sans-serif; line-height:1.45;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  h1,h2,.num{font-family:'Fraunces',serif;}
  header{ padding:calc(24px + env(safe-area-inset-top)) 24px 16px; border-bottom:1px solid var(--hairline); }
  h1{font-size:26px; font-weight:600; margin:0 0 4px;}
  #updated{margin:8px 0 0; color:var(--muted); font-size:13px;}
  main{max-width:640px; margin:0 auto; padding:0 20px;}
  .screen{display:none;}
  .screen.active{display:block;}
  section{padding:24px 4px;}
  section + section{border-top:1px solid var(--hairline);}
  h2{font-size:20px; font-weight:600; margin:0 0 16px;}
  .pill-row{display:flex; gap:10px; flex-wrap:wrap;}
  .pill{display:flex; align-items:center; gap:8px; font-size:14px; background:none; border:1px solid var(--hairline); color:var(--cream); border-radius:20px; padding:8px 14px; font-family:inherit; cursor:pointer;}
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.on{background:var(--gold);}
  .dot.off{background:transparent; border:1px solid var(--muted);}
  .price-cap-field{margin-top:14px;}
  .price-cap-field label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px;}
  .price-cap-field input{background:var(--navy-light); border:1px solid var(--hairline); color:var(--cream); border-radius:8px; padding:8px 12px; font-family:inherit; font-size:14px; width:120px;}
  .row{display:flex; gap:16px; padding:14px 0;}
  .row + .row{border-top:1px solid var(--hairline);}
  .date-badge{flex:0 0 52px; text-align:center;}
  .date-badge .day{font-size:22px; font-weight:600; display:block;}
  .date-badge .month{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em;}
  .item-name{font-weight:600; font-size:16px;}
  .item-note{color:var(--muted); font-size:13px; margin-top:2px;}
  .tag{display:inline-block; font-size:12px; color:var(--coral); margin-top:4px;}
  .directions{font-size:13px; color:var(--gold); text-decoration:none; display:inline-block; margin-top:6px;}
  .buy-row{padding:16px 0;}
  .buy-row + .buy-row{border-top:1px solid var(--hairline);}
  .buy-body{display:flex; gap:12px;}
  .card-img{width:56px; height:auto; border-radius:4px; flex-shrink:0;}
  .buy-main{flex:1; min-width:0;}
  .buy-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  .price{font-size:22px; font-weight:600; color:var(--gold); white-space:nowrap;}
  .market{color:var(--muted); font-size:13px; margin-left:6px;}
  .roi{color:var(--coral); font-size:13px; font-weight:500; text-align:right;}
  .thesis{color:var(--muted); font-size:13px; margin-top:6px; max-width:52ch;}
  .source{color:var(--muted); font-size:11px; margin-top:6px; display:block;}
  .tcg-link{color:var(--gold); font-size:13px; text-decoration:none; display:inline-block; margin-top:6px;}
  .verdict{font-size:13px; font-weight:600; margin-top:4px;}
  .verdict-sell{color:var(--gold);}
  .verdict-hold{color:var(--cream);}
  .verdict-watch{color:var(--coral);}
  .empty{color:var(--muted); font-size:14px;}
  .warn{border-left:3px solid var(--coral); padding:12px 16px; background:var(--navy-light); margin-top:16px;}
  .warn .item-name{color:var(--cream);}
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--navy-light); border-top:1px solid var(--hairline); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:10;}
  .tabbar button{flex:1; background:none; border:none; color:var(--muted); font-family:'IBM Plex Sans',sans-serif; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px 0; cursor:pointer;}
  .tabbar button.active{color:var(--gold);}
  .tabbar svg{width:22px; height:22px;}
</style>
</head>
<body>
  <header>
    <h1>Poke Fips</h1>
    <p id="updated">Loading…</p>
  </header>
  <main>
    <section id="screen-buylist" class="screen active">
      <h2>Strategy</h2>
      <div id="strategy-list" class="pill-row"></div>
      <div class="price-cap-field">
        <label for="price-cap-input">Max price to show</label>
        <input type="number" id="price-cap-input" placeholder="No limit" min="1">
      </div>
    </section>
    <section id="screen-buylist2" class="screen active" style="border-top:1px solid var(--hairline);">
      <h2>Buy list</h2>
      <div id="buylist-list"></div>
      <div id="giveaways-list"></div>
    </section>
    <section id="screen-owned" class="screen">
      <h2>Owned</h2>
      <div id="holdings-list"><p class="empty">Loading…</p></div>
    </section>
    <section id="screen-events" class="screen">
      <h2>Upcoming shows</h2>
      <div id="shows-list"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-screen="buylist" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="5" cy="6" r="1"/><line x1="9" y1="6" x2="20" y2="6"/><circle cx="5" cy="12" r="1"/><line x1="9" y1="12" x2="20" y2="12"/><circle cx="5" cy="18" r="1"/><line x1="9" y1="18" x2="20" y2="18"/></svg>
      Buy list
    </button>
    <button data-screen="owned">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8 L12 4 L21 8 L21 17 L12 21 L3 17 Z"/><path d="M3 8 L12 12 L21 8"/><line x1="12" y1="12" x2="12" y2="21"/></svg>
      Owned
    </button>
    <button data-screen="events">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      Events
    </button>
  </nav>

<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TYPE_LABELS = { sealed: 'Sealed', single: 'Raw single', slab: 'Slab' };
const TOGGLE_LABELS = { sealed: 'Sealed', rawSingles: 'Raw singles', slabs: 'Slabs' };
let holdingsLoaded = false;
let currentData = null;

document.querySelectorAll('.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.screen === 'buylist') {
      document.getElementById('screen-buylist').classList.add('active');
      document.getElementById('screen-buylist2').classList.add('active');
    } else {
      document.getElementById('screen-' + btn.dataset.screen).classList.add('active');
    }
    if (btn.dataset.screen === 'owned' && !holdingsLoaded) {
      holdingsLoaded = true;
      loadHoldings();
    }
  });
});

function cardImageUrl(cardId) {
  if (!cardId) return null;
  const idx = cardId.lastIndexOf('-');
  if (idx === -1) return null;
  return `https://images.pokemontcg.io/${cardId.slice(0, idx)}/${cardId.slice(idx + 1)}.png`;
}

function tcgplayerUrl(name, set) {
  return `https://www.tcgplayer.com/search/pokemon/product?productLineName=pokemon&q=${encodeURIComponent((name + ' ' + (set || '')).trim())}`;
}

function parseROI(str) {
  const m = String(str || '').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : -Infinity;
}

async function resolveCardImage(name, set) {
  try {
    const res = await fetch(`/api/card-image?name=${encodeURIComponent(name)}&set=${encodeURIComponent(set || '')}`);
    if (!res.ok) return null;
    return (await res.json()).image || null;
  } catch (e) {
    return null;
  }
}

function cardImageSlot(name, set, cardId) {
  const direct = cardImageUrl(cardId);
  if (direct) return `<img class="card-img" src="${direct}" alt="${name}" loading="lazy">`;
  return `<img class="card-img card-img-lookup" data-name="${name}" data-set="${set || ''}" alt="${name}">`;
}

async function fillLookupImages() {
  for (const el of document.querySelectorAll('.card-img-lookup')) {
    const img = await resolveCardImage(el.dataset.name, el.dataset.set);
    if (img) el.src = img; else el.remove();
  }
}

async function toggleType(type, current) {
  try {
    const res = await fetch('/api/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, value: !current })
    });
    const ct = res.headers.get('content-type') || '';
    if (!res.ok || !ct.includes('json')) throw new Error('auth needed');
    const state = await res.json();
    currentData.strategy.productTypes = state;
    renderStrategy(state);
    renderBuyList(currentData);
  } catch (e) {
    if (confirm('You may need to sign in first. Open sign-in now?')) {
      window.location.href = '/api/toggle';
    }
  }
}

async function setPriceCap(value) {
  try {
    const res = await fetch('/api/price', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ maxPrice: value })
    });
    const ct = res.headers.get('content-type') || '';
    if (!res.ok || !ct.includes('json')) throw new Error('auth needed');
    const data = await res.json();
    currentData.strategy.maxPrice = data.maxPrice;
    renderBuyList(currentData);
  } catch (e) {
    if (confirm('You may need to sign in first. Open sign-in now?')) {
      window.location.href = '/api/price';
    }
  }
}

function renderStrategy(types) {
  const el = document.getElementById('strategy-list');
  el.innerHTML = Object.entries(types).map(([k, v]) => `
    <button class="pill" data-type="${k}"><span class="dot ${v ? 'on' : 'off'}"></span>${TOGGLE_LABELS[k] || k} ${v ? 'on' : 'off'}</button>
  `).join('');
  el.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => toggleType(btn.dataset.type, types[btn.dataset.type]));
  });
}

function renderPriceCap(maxPrice) {
  const input = document.getElementById('price-cap-input');
  input.value = maxPrice != null ? maxPrice : '';
  input.onchange = () => setPriceCap(input.value ? Number(input.value) : null);
}

function renderBuyList(data) {
  const typeMap = { sealed: 'sealed', single: 'rawSingles', slab: 'slabs' };
  const maxPrice = data.strategy.maxPrice;
  const visible = data.buyList
    .filter(b => data.strategy.productTypes[typeMap[b.type]] !== false && (maxPrice == null || b.targetPrice <= maxPrice))
    .sort((a, b) => parseROI(b.expectedROI) - parseROI(a.expectedROI));
  const buyEl = document.getElementById('buylist-list');
  if (!visible.length) {
    buyEl.innerHTML = `<p class="empty">${data.buyList.length ? 'No picks match your current filters.' : (data.buyListNote || 'No picks right now.')}</p>`;
  } else {
    buyEl.innerHTML = visible.map(b => {
      const typeLabel = TYPE_LABELS[b.type] || b.type || '';
      const secondary = b.ev != null ? `EV $${b.ev.toFixed(2)}` : (b.marketPrice != null ? `mkt $${b.marketPrice.toFixed(2)}` : '');
      return `<div class="buy-row"><div class="buy-body">
        ${cardImageSlot(b.card, b.set, b.cardId)}
        <div class="buy-main">
          <div class="buy-head">
            <div>
              <div class="item-name">${b.card}${b.grade ? ' · ' + b.grade : ''}</div>
              <div class="item-note">${typeLabel}${b.set ? ' · ' + b.set : ''}</div>
            </div>
            <div>
              <span class="num price">$${b.targetPrice.toFixed(2)}</span>
              ${secondary ? `<span class="market">${secondary}</span>` : ''}
              <div class="roi">${b.expectedROI} net · sell by ${b.sellBy}</div>
            </div>
          </div>
          <div class="thesis">${b.thesis}</div>
          <a class="tcg-link" href="${tcgplayerUrl(b.card, b.set)}" target="_blank" rel="noopener">View on TCGplayer</a>
          <span class="source">${b.source}</span>
        </div>
      </div></div>`;
    }).join('');
  }

  const giveEl = document.getElementById('giveaways-list');
  giveEl.innerHTML = data.giveaways.length
    ? data.giveaways.map(g => `<div class="warn"><div class="item-name">${g.name}</div><div class="tag">${g.flag}</div><div class="item-note">${g.note}</div></div>`).join('')
    : '';

  fillLookupImages();
}

async function loadHoldings() {
  const el = document.getElementById('holdings-list');
  try {
    const res = await fetch('/holdings.json?_=' + Date.now());
    const ct = res.headers.get('content-type') || '';
    if (!res.ok || !ct.includes('json')) throw new Error('not authorized');
    const data = await res.json();
    renderHoldings(data.holdings || []);
  } catch (e) {
    el.innerHTML = `<p class="empty">Sign in with your Google account to view your owned cards.</p>
      <a class="tcg-link" href="/holdings.json">Sign in</a>`;
  }
}

function renderHoldings(holdings) {
  const el = document.getElementById('holdings-list');
  if (!holdings.length) {
    el.innerHTML = '<p class="empty">Nothing bought yet. Once you pick up a card from the buy list, it shows up here with a hold/sell verdict each run.</p>';
    return;
  }
  el.innerHTML = holdings.map(h => {
    const verdictClass = h.verdict === 'sell' ? 'verdict-sell' : h.verdict === 'watch' ? 'verdict-watch' : 'verdict-hold';
    const verdictLabel = h.verdict === 'sell' ? 'Sell now' : h.verdict === 'watch' ? 'Watch' : 'Hold';
    return `<div class="buy-row"><div class="buy-body">
      ${cardImageSlot(h.card, h.set, h.cardId)}
      <div class="buy-main">
        <div class="item-name">${h.card}${h.set ? ' · ' + h.set : ''}</div>
        <div class="item-note">Bought $${h.buyPrice != null ? h.buyPrice.toFixed(2) : '—'}${h.buyDate ? ' on ' + h.buyDate : ''}</div>
        <div class="verdict ${verdictClass}">${verdictLabel}${h.currentMarketPrice != null ? ' · mkt $' + h.currentMarketPrice.toFixed(2) : ''}</div>
        <div class="thesis">${h.recommendation || ''}</div>
        <a class="tcg-link" href="${tcgplayerUrl(h.card, h.set)}" target="_blank" rel="noopener">View on TCGplayer</a>
      </div>
    </div></div>`;
  }).join('');
  fillLookupImages();
}

Promise.all([
  fetch('./data.json?_=' + Date.now()).then(r => r.json()),
  fetch('/api/state').then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([data, liveState]) => {
  if (liveState) {
    data.strategy.productTypes = liveState.productTypes;
    data.strategy.maxPrice = liveState.maxPrice;
  }
  render(data);
}).catch(() => { document.getElementById('updated').textContent = 'Could not load data.'; });

function render(data) {
  currentData = data;
  document.getElementById('updated').textContent = 'Updated ' + data.generated_at;
  renderStrategy(data.strategy.productTypes);
  renderPriceCap(data.strategy.maxPrice != null ? data.strategy.maxPrice : null);

  const shows = [...data.shows].sort((a, b) => new Date(a.start_date) - new Date(b.start_date));
  document.getElementById('shows-list').innerHTML = shows.map(s => {
    const d = new Date(s.start_date + 'T00:00:00');
    const daysUntil = Math.ceil((d - new Date()) / 86400000);
    const countdown = daysUntil > 1 ? `In ${daysUntil} days` : daysUntil === 1 ? 'Tomorrow' : daysUntil === 0 ? 'Today' : '';
    const mapsUrl = 'https://maps.apple.com/?q=' + encodeURIComponent(s.venue);
    return `<div class="row">
      <div class="date-badge"><span class="day">${d.getDate()}</span><span class="month">${MONTHS[d.getMonth()]}</span></div>
      <div>
        <div class="item-name">${s.name}</div>
        <div class="item-note">${s.venue} · ${s.display_dates}${countdown ? ' · ' + countdown : ''}</div>
        <div class="item-note">${s.note}</div>
        ${s.unconfirmed ? '<div class="tag">Unconfirmed</div>' : ''}
        <a class="directions" href="${mapsUrl}">Directions</a>
      </div>
    </div>`;
  }).join('');

  renderBuyList(data);
}
</script>
</body>
</html>
